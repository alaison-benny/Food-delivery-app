apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-app
  template:
    metadata:
      labels:
        app: order-app
    spec:
      containers:
      - name: order-container
        # ഇവിടെ :v1 ചേർത്തിട്ടുണ്ട്
        image: 485044328888.dkr.ecr.us-east-2.amazonaws.com/order-service:v1
        ports:
        - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: LoadBalancer
  selector:
    app: order-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5002